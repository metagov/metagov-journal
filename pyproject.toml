[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mgj"
version = "0.1.0"
description = "Metagov Journal — RDF-native authoring, validation, and compilation tooling for the institutional catechism"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "rdflib>=7.0.0",
    "pyshacl>=0.25.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
mgj = "mgj.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mgj"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
